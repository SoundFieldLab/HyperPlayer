[package]
name = "hyperplayer"
version = "0.1.0"
description = "HyperPlayer desktop shell (Tauri 2, zero custom Rust)"
edition = "2021"
authors = ["IceFireIcer"]

# Official Tauri 2 template structure. No custom Rust business logic.

[lib]
name = "hyperplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# unsafe-headers：网易云协议层的登录态全靠手动 Cookie/Referer 头，
# 默认 fetch-spec forbidden 清单会把它们静默丢弃（表现为永远匿名/风控拦截）。
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-stronghold = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
