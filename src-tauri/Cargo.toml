[package]
name = "hyperplayer-app"
version = "0.1.0"
edition = "2021"
description = "HyperPlayer Tauri 2 Windows application shell"
license = "Apache-2.0"

[lib]
name = "hyperplayer_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
hyperplayer-engine = { version = "0.1.0", path = "../crates/hyperplayer-engine" }
hyperplayer-source-netease = { version = "0.1.0", path = "../crates/hyperplayer-source-netease" }
minisign-verify = "0.2.5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["native-tls", "zip"] }
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1", features = ["net", "sync"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Media", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
