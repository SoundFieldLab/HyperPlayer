[workspace]

[package]
name = "hyperplayer-source-netease"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "HyperPlayer Netease source Cleanroom implementation"

[dependencies]
aes = "0.8.4"
async-trait = "0.1.89"
base64 = "0.22.1"
cipher = { version = "0.4.4", features = ["alloc", "block-padding"] }
flate2 = "1.1.2"
futures = "0.3.31"
hmac = "0.12.1"
md-5 = "0.10.6"
num-bigint = "0.5.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.8.5"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls-native-roots"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["sync", "time"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
