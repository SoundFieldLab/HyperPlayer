[package]
name = "hyperplayer-engine"
version = "0.1.0"
edition = "2021"
description = "HyperPlayer 框架无关的音频引擎与曲库核心"
license = "Apache-2.0"

[dependencies]
claxon = "0.4.3"
cpal = "0.18.2"
crossbeam-queue = "0.3"
hse-core = { package = "hyperplayer-hse-core", version = "=1.5.1", path = "../hyperplayer-hse-core" }
lofty = "0.25.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"
