[package]
name = "hyperplayer-engine"
version = "0.1.0"
edition = "2021"
description = "HyperPlayer 框架无关的本地曲库核心（SQLite/lofty/封面）"
license = "Apache-2.0"

[dependencies]
lofty = "0.25.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"
