[package]
name = "hyperplayer-hse-core"
description = "HyperSoundEngine Rust 支线 DSP 内核与引擎链（纯库：稳态零分配、确定性、平台无关）"
version = "1.5.1"
edition = "2021"
license = "Apache-2.0"
authors = ["HyperSoundEngine Contributors"]
repository = "https://github.com/IceFireIcer/HyperSoundEngine"
publish = false

[lib]
name = "hse_core"

[dependencies]
hrtf-core = { package = "hyperplayer-hrtf-core", version = "=1.5.1", path = "../hyperplayer-hrtf-core" }
serde_json = "1"
