# 预发布（Pre-release）—— 打版本 tag 时构建并发布 Windows 预发布版。
#
# 命名约定：本项目处于 Beta 阶段，版本化发布一律以 GitHub **Pre-release** 形式发布
# （nightly.yml 是每日自动构建，这里是人工发版的通道）。
#
# 触发：
#   推送 v* tag            -> 用该 tag 发布
#   手动触发（workflow_dispatch）-> 用输入 tag；留空则取 package.json 版本拼 v<version>，
#                                   若该 tag 不存在则在当前 HEAD 上创建并推送
#
# 是否写入 update.json（决定「设置 → 检查更新」能否把这一版推给用户）：
#   仅当 tag 是**纯语义版本号**（如 v0.2.0）时写入；
#   带预发布后缀（如 v0.2.0-beta.1 / v0.2.0-rc.1）只发 GitHub 预发布，**不动更新通道**，
#   避免 Beta 版本被推送给所有正式用户。测试者按需到 Releases 页面手动下载。
#
# 产物：
#   1) HyperPlayer-<version>-Setup.exe   完整 NSIS 安装包（含 Widevine VMP 签名）
#   2) hyperplayer-hot-<version>.zip     热更新包（app.asar + app.asar.unpacked）
#
# 需要仓库 Secrets：EVS_ACCOUNT_NAME / EVS_PASSWD（castLabs Widevine VMP 签名）。
# 注意：写入 update.json 需要默认分支允许 Actions 推送（分支保护需放行，或用 PAT）。

name: Pre-release 预发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.2.0）。留空则用 package.json 版本自动生成 v<version>'
        required: false
        default: ''
      force:
        description: '覆盖已存在的同名 release'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 创建 release / 推送 tag / 提交 update.json

jobs:
  # ---------- 准备：解析 tag、判定稳定性、生成 changelog ----------
  prepare:
    name: 准备（tag / 版本 / Changelog）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_stable: ${{ steps.meta.outputs.is_stable }}
      force: ${{ steps.meta.outputs.force }}
      has_evs: ${{ steps.meta.outputs.has_evs }}
    steps:
      - name: 拉取代码（完整历史 + tags）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 解析 tag / 版本 / 稳定性 / changelog
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          # EVS 凭据是否存在（决定能否做 Widevine VMP 签名 → 决定 Apple Music 原生 DRM 可用性）
          HAS_EVS: ${{ secrets.EVS_ACCOUNT_NAME != '' && secrets.EVS_PASSWD != '' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
            if [ -z "$TAG" ]; then
              TAG="v$(node -p "require('./package.json').version")"
            fi
            # 手动触发时允许在该 tag 发布
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "本地不存在 tag $TAG，在当前 HEAD 上创建并推送"
              git tag "$TAG"
              git push origin "refs/tags/$TAG"
            fi
          fi

          VERSION="${TAG#v}"

          # 纯语义版本号（无 -beta/-rc 等后缀）才回写 update.json
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            IS_STABLE="true"
          else
            IS_STABLE="false"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_stable=${IS_STABLE}" >> "$GITHUB_OUTPUT"
          echo "force=${INPUT_FORCE:-false}" >> "$GITHUB_OUTPUT"
          echo "has_evs=${HAS_EVS:-false}" >> "$GITHUB_OUTPUT"

          # changelog：自上一个 v* tag 起（排除当前 tag）的提交
          PREV=$(git tag -l 'v*' --sort=-creatordate | grep -vx "$TAG" | head -1 || true)
          {
            echo "# HyperPlayer ${VERSION}"
            echo ""
            if [ -n "${PREV:-}" ]; then
              echo "## 更新内容（自 ${PREV} 起）"
              echo ""
              git log "${PREV}..${TAG}" --no-merges --pretty=format:"- %s (%h)" 2>/dev/null || true
            else
              echo "## 更新内容（无更早的版本 tag，列出最近 30 条提交）"
              echo ""
              git log "$TAG" -30 --no-merges --pretty=format:"- %s (%h)" 2>/dev/null || true
            fi
            echo ""
            echo ""
            echo "---"
            if [ "$IS_STABLE" = "true" ]; then
              echo "安装包：HyperPlayer-${VERSION}-Setup.exe ｜ 热更新包：hyperplayer-hot-${VERSION}.zip"
            else
              echo "⚠️ 预发布版本（${VERSION}），不会推送给正式用户；仅供测试，请手动下载安装。"
            fi
            if [ "${HAS_EVS:-false}" != "true" ]; then
              echo ""
              echo ""
              echo "> ⚠️ **本版为未签名构建**：未配置 EVS 凭据，跳过了 Widevine VMP 签名。"
              echo "> Apple Music 原生 DRM 音源不可用，会自动回退到网易云 / QQ 载体匹配；其余功能不受影响。"
              echo "> 若需 Apple Music 原生播放，请配置仓库 Secrets \`EVS_ACCOUNT_NAME\` / \`EVS_PASSWD\` 后重新发布。"
            fi
          } > changelog.md

          echo "::group::Changelog 预览"
          cat changelog.md
          echo "::endgroup::"
          echo "已解析：tag=${TAG} version=${VERSION} is_stable=${IS_STABLE} has_evs=${HAS_EVS:-false}"

      - name: 上传 changelog（供 publish 作业使用）
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-meta
          path: changelog.md

  # ---------- Windows 构建：安装包 + 热更新包 ----------
  build-windows:
    name: Windows 构建（安装包 + 热更新包）
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
      HAS_EVS: ${{ needs.prepare.outputs.has_evs }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts：跳过第三方 postinstall（useragent-ng 的 ./bin/build.js 在 Windows cmd 下失败）。
      # Electron 二进制由下面单独的步骤显式下载。
      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 对齐版本号到 tag（仅工作区，版本号唯一事实源仍是 package.json）
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e "const fs=require('fs');for(const f of ['./package.json','./package-lock.json']){const j=JSON.parse(fs.readFileSync(f));j.version=process.env.RELEASE_VERSION;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')}"
          node -p "require('./package.json').version"

      - name: 下载 Electron 运行时（npm ci 跳过其安装脚本）
        run: node node_modules/electron/install.js

      - name: 安装 castLabs EVS（仅当配置了 EVS 凭据）
        if: env.HAS_EVS == 'true'
        # 用 `python -m pip`（而非 py -3 启动器）：与 scripts/evs-runner.cjs 的解释器探测顺序一致，
        # 且避免 py 启动器在部分 runner 镜像上不可用。
        run: |
          python -m pip install --upgrade pip
          python -m pip install castlabs-evs==1.3.2
          python -c "import castlabs_evs; print('castlabs-evs', castlabs_evs.__version__)"

      - name: 构建 NSIS 安装包（已签名，Apple Music 原生 DRM 可用）
        if: env.HAS_EVS == 'true'
        env:
          EVS_NO_ASK: "1"
        run: npm run build:electron
        timeout-minutes: 50

      - name: 构建 NSIS 安装包（未签名：未配置 EVS 凭据）
        if: env.HAS_EVS != 'true'
        run: |
          Write-Host '::warning::未配置 EVS_ACCOUNT_NAME / EVS_PASSWD，本次为未签名构建；Apple Music 原生 DRM 不可用（自动回退网易云/QQ 载体匹配），其余功能不受影响。'
          npm run build:electron:unsigned
        timeout-minutes: 50

      - name: 生成热更新包（app.asar + app.asar.unpacked）
        run: node scripts/build-hot-update.mjs

      - name: 列出构建产物
        shell: pwsh
        run: Get-ChildItem release -File | Select-Object Name, Length

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-installer
          path: release/*.exe

      - name: 上传热更新包
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-hot
          path: release/*.zip

  # ---------- 发布：创建 GitHub 预发布（纯版本号额外回写 update.json） ----------
  publish:
    name: 发布 GitHub Pre-release
    needs: [prepare, build-windows]
    if: needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取默认分支（写 update.json 需要能提交并推送）
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 下载 changelog
        uses: actions/download-artifact@v4
        with:
          name: pre-release-meta

      - name: 下载安装包与热更新包
        uses: actions/download-artifact@v4
        with:
          pattern: pre-release-*
          merge-multiple: true
          path: artifacts

      - name: 创建 GitHub 预发布（含两个产物）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          FORCE: ${{ needs.prepare.outputs.force }}
        run: |
          set -euo pipefail
          ls -la artifacts
          if [ "$FORCE" = "true" ]; then
            gh release delete "$TAG" -y || echo "没有需要覆盖的同名 release"
          fi
          gh release create "$TAG" \
            --title "HyperPlayer ${VERSION}" \
            --notes-file changelog.md \
            --prerelease \
            --verify-tag \
            artifacts/*
          echo "已发布预发布：${TAG}"

      - name: 生成并回写 update.json（仅纯语义版本号）
        if: needs.prepare.outputs.is_stable == 'true'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cat > gen-manifest.cjs <<'JS'
          const fs = require('fs')
          const crypto = require('crypto')
          const path = require('path')

          const repo = process.env.GITHUB_REPOSITORY
          const tag = process.env.TAG
          const version = process.env.VERSION
          const dir = 'artifacts'
          const base = `https://github.com/${repo}/releases/download/${tag}`

          const files = fs.readdirSync(dir)
          const installer = files.find(f => /-Setup\.exe$/i.test(f))
          const hot = files.find(f => /^hyperplayer-hot-.*\.zip$/i.test(f))
          if (!installer) throw new Error('未找到 NSIS 安装包（*-Setup.exe）')

          const sha256 = (f) => crypto.createHash('sha256')
            .update(fs.readFileSync(path.join(dir, f)))
            .digest('hex')

          const manifest = {
            channel: 'stable',
            version,
            notes: fs.readFileSync('changelog.md', 'utf8').trim(),
            artifacts: {
              'win-x64': { urls: [`${base}/${installer}`], sha256: sha256(installer) },
            },
          }
          if (hot) {
            manifest.artifacts['win-x64-hot'] = { urls: [`${base}/${hot}`], sha256: sha256(hot) }
          }

          fs.writeFileSync('update.json', JSON.stringify(manifest, null, 2) + '\n')
          console.log('已生成 update.json：')
          console.log(JSON.stringify(manifest, null, 2))
          JS
          node gen-manifest.cjs

      - name: 提交 update.json 到默认分支
        if: needs.prepare.outputs.is_stable == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json 无变化，跳过提交"
          else
            git commit -m "chore(release): 更新 update.json 至 v${VERSION}"
            git push origin HEAD:main
            echo "已推送 update.json（用户「检查更新」即可收到 v${VERSION}）"
          fi
