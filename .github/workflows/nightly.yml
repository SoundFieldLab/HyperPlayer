# 每日构建（Nightly）—— 默认分支有新代码提交时自动构建 Windows 测试版。
#
# 行为约定：
#   - 不 bump 正式版本号：仅在工作区拼「基础版本 patch+1 -nightly.<YYYYMMDD>」用于产物命名与
#     更新清单版本号，不推回仓库（package.json 保持正式版本号不变）。
#   - **触发条件：main 上有新的代码提交**（不再按 cron 每天跑）。
#     机器人回写更新清单的那条提交不触发（见 on.push.paths-ignore），没有提交的日子不出 nightly。
#     也可以手动触发；把 force 设为 true 可跳过「无新增提交」判定强制构建。
#   - **每次构建生成唯一 tag（nightly-<YYYYMMDD>）并创建独立的 GitHub Pre-release**
#     （与 pre-release.yml 一致，一律以 Pre-release 形式发布）。
#     同一天重复构建（当天又有提交 / force=true）会覆盖当天的 tag 与 release。
#   - **滚动保留最近 3 个 nightly**：每次发布成功后删掉更早的 nightly release 与 tag，
#     只留最新三个（release 作业末尾的「保留最近 3 个 nightly」步骤）。
#   - changelog 覆盖上一个 nightly tag 之后的提交。
#   - 产物：**只发布 NSIS 安装包（`HyperPlayer-<版本>-Setup.exe`）**——2026-09-14 起不再发
#     便携版 zip（`release/win-unpacked/` 只是本地调试产物，不随 releases 分发）。
#   - 生成并提交 `update-nightly.json`（nightly 渠道的更新清单）——供客户端
#     「更新渠道 = 每日构建（Nightly）」时拉取；正式版清单 `update.json` 不受影响。
#   - 无新增提交时**取消本次运行**（force=true 可跳过）：判定为「无代码变更」后，prepare 在
#     最后一步 cancel 自身运行——Actions 里显示 cancelled，而不是一次「success 但当次全部跳过」
#     的假构建。判定用**树 diff** 且排除回写的清单文件（update-nightly.json / update.json），
#     否则回写提交会让 HEAD 永远领先于上次 nightly tag，判定失效
#     （2026-09-14~10-04 曾因此连发 21 次无代码变更的 nightly）。
#     ⚠️ 取消自身运行需要 actions: write 权限（见下方 permissions）。
name: Nightly Build 每日构建

on:
  push:
    branches: [main]
    # 机器人回写的更新清单不算代码变更，不触发构建（否则会自触发成循环）。
    paths-ignore:
      - update-nightly.json
      - update.json
  workflow_dispatch:
    inputs:
      force:
        description: '强制构建（忽略「无新增提交」跳过逻辑）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: nightly-build
  cancel-in-progress: false

permissions:
  contents: write   # gh release create / 移动 nightly tag / 回写 update-nightly.json 需要
  actions: write    # 无新增提交时 cancel 本次运行（gh run cancel）需要

jobs:
  # ---------- 准备：日期 / nightly 版本 / changelog / 跳过判定 ----------
  prepare:
    name: 准备（日期 / 版本 / Changelog）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      nightly_tag: ${{ steps.meta.outputs.nightly_tag }}
      nightly_version: ${{ steps.meta.outputs.nightly_version }}
      has_changes: ${{ steps.meta.outputs.has_changes }}
    steps:
      - name: 拉取代码（完整历史，供查找上一个 nightly tag 与生成 changelog）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 计算日期 / nightly 版本 / changelog
        id: meta
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          NIGHTLY_TAG="nightly-${DATE}"

          # 基础版本只读 package.json，不改仓库；nightly 版本仅用于产物命名与更新清单。
          # 版本号取「基础版本的 patch + 1」再挂 -nightly.<日期>（如 1.0.0 -> 1.0.1-nightly.20260911）：
          # 按 semver，1.0.1-nightly < 1.0.1 但 > 1.0.0，因此装了正式版 1.0.0 的用户
          # 切到 nightly 渠道后能立即检测到该 nightly（而 1.0.0-nightly.x 会低于 1.0.0 检测不到）。
          BASE_VERSION=$(node -p "require('./package.json').version")
          NEXT_PATCH=$(BASE_VERSION="$BASE_VERSION" node -e "
            const v = process.env.BASE_VERSION.replace(/^v/, '').split('.').map(n => parseInt(n, 10) || 0);
            const major = v[0] || 0, minor = v[1] || 0, patch = (v[2] || 0) + 1;
            process.stdout.write([major, minor, patch].join('.'));
          ")
          NIGHTLY_VERSION="${NEXT_PATCH}-nightly.${DATE}"

          # changelog 覆盖上一个 nightly tag 之后的提交；首次运行回退最近正式版 tag，再无则回退最近 50 条
          # 排除当天自己的 tag：当天重复构建时，changelog 应覆盖「上一个 nightly 之后」的全部提交，
          # 而不是从当天 tag 起（否则当天第二次构建的 changelog 会丢失当天已有提交）。
          LAST_NIGHTLY=$(git tag -l 'nightly-*' --sort=-creatordate | grep -vx "$NIGHTLY_TAG" | head -1 || true)
          LAST_STABLE=$(git tag -l 'v*' --sort=-creatordate | head -1)
          if [ -n "$LAST_NIGHTLY" ]; then
            RANGE="${LAST_NIGHTLY}..HEAD"
          else
            RANGE="${LAST_STABLE:+${LAST_STABLE}..HEAD}"
          fi

          # 无新增提交判定：与「上一个 nightly tag」比较（force=true 时强制构建）。
          # 判为 false 时，本作业末尾会**取消整次运行**（不构建、不发版、不上传 changelog）。
          # 用**排除清单回写文件的树 diff** 而非「tag/HEAD SHA 相等」：
          # 本工作流每次发布都会向 main 回写一条 update-nightly.json 提交（release.yml 亦回写
          # update.json），若不做排除，HEAD 永远领先于上次 nightly tag，判定永远为「有变更」，
          # nightly 会每天空转构建（2026-09-14~10-04 曾连发 21 次无代码变更的 nightly）。
          HAS_CHANGES="true"
          if [ "$FORCE" != "true" ] && [ -n "$LAST_NIGHTLY" ]; then
            if git diff --quiet "$LAST_NIGHTLY" HEAD -- . ':(exclude)update-nightly.json' ':(exclude)update.json'; then
              HAS_CHANGES="false"
            fi
          fi

          {
            echo "# HyperPlayer Nightly ${DATE}"
            echo ""
            echo "**版本号：${NIGHTLY_VERSION}（基础 ${BASE_VERSION} + 构建日期，非正式发版，不自动升级版本号）**"
            echo ""
            if [ -n "$RANGE" ]; then
              echo "## 代码变动（自上次 Nightly 构建 ${RANGE%%..*} 起）"
              echo ""
              LOG=$(git log $RANGE --no-merges --pretty=format:"- %s (%h)" -- . ':(exclude)update-nightly.json' ':(exclude)update.json' 2>/dev/null)
              if [ -z "$LOG" ]; then echo "- 无新增提交"; else echo "$LOG"; fi
            else
              echo "## 代码变动（暂无 nightly / 正式版 tag，最近 50 条提交）"
              echo ""
              git log -50 --no-merges --pretty=format:"- %s (%h)" -- . ':(exclude)update-nightly.json' ':(exclude)update.json'
            fi
            echo ""
            echo ""
            echo "---"
            echo "**下载**"
            echo ""
            echo "- \`HyperPlayer-*-Setup.exe\` —— NSIS 安装包，双击安装（推荐普通用户）"
            echo ""
            echo "⚠️ 自动构建的测试版本，可能不稳定。仅供主动切换到「每日构建（Nightly）」渠道的用户，不影响正式版更新通道。"
          } > changelog.md

          echo "nightly_tag=${NIGHTLY_TAG}" >> "$GITHUB_OUTPUT"
          echo "nightly_version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "has_changes=${HAS_CHANGES}" >> "$GITHUB_OUTPUT"

          echo "::group::Changelog 预览"
          cat changelog.md
          echo "::endgroup::"
          echo "已计算：tag=${NIGHTLY_TAG} version=${NIGHTLY_VERSION} has_changes=${HAS_CHANGES}"

      # ---------- 无代码变更：直接取消本次运行（不构建、不发版） ----------
      - name: 跳过摘要（无代码变更时）
        if: steps.meta.outputs.has_changes != 'true'
        env:
          NIGHTLY_TAG: ${{ steps.meta.outputs.nightly_tag }}
        run: |
          {
            echo "### ⏭ 本次 nightly 已取消（${NIGHTLY_TAG}）"
            echo ""
            echo "自上一个 nightly tag 以来没有代码变更（只有更新清单回写或无新提交），"
            echo "本次不构建安装包、不发布 Pre-release、不覆盖当天 tag。"
            echo ""
            echo "需要强制构建：Actions → Nightly Build → Run workflow，把 \`force\` 设为 \`true\`。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 无新增提交 → 取消本次运行
        if: steps.meta.outputs.has_changes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.meta.outputs.nightly_tag }}
        run: |
          echo "自上一个 nightly tag 以来无代码变更，取消本次运行（${NIGHTLY_TAG} 不构建、不发版）。"
          # 取消会随即终结当前作业，故本步放在 prepare 的最后，changelog 也就不必上传。
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" \
            || echo "取消请求未被受理（运行可能已自行结束），忽略"

      - name: 上传 changelog（供 release 作业读取）
        if: steps.meta.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-meta
          path: changelog.md

  # ---------- Windows 安装包构建 ----------
  build-windows:
    name: Windows 安装包构建
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts：跳过第三方 postinstall（useragent-ng 的 ./bin/build.js 在 Windows cmd 下失败）。
      # Electron 二进制由下面单独的步骤显式下载。
      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 写入 nightly 版本号到 package.json 与 lock（仅工作区，不推回仓库）
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.nightly_version }}
        run: |
          node -e "const fs=require('fs');for(const f of ['./package.json','./package-lock.json']){const j=JSON.parse(fs.readFileSync(f));j.version=process.env.NIGHTLY_VERSION;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')}"
          node -p "require('./package.json').version"

      - name: 下载 Electron 运行时（npm ci 跳过其安装脚本）
        run: node node_modules/electron/install.js

      - name: 构建 NSIS 安装包
        run: npm run build:electron
        timeout-minutes: 40

      - name: 校验 app.asar 体积与内容
        run: node scripts/check-packaging.mjs

      - name: 列出构建产物
        shell: pwsh
        run: Get-ChildItem release -File | Select-Object Name, Length

      - name: 上传安装包（.exe）
        uses: actions/upload-artifact@v4
        with:
          name: nightly-windows-installer
          path: release/*.exe

  # ---------- 发布独立的 Nightly 预发布 ----------
  release:
    name: 发布 Nightly 预发布
    needs: [prepare, build-windows]
    if: ${{ needs.prepare.outputs.has_changes == 'true' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码（完整历史 + tags，供打 tag 使用）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 changelog
        uses: actions/download-artifact@v4
        with:
          name: nightly-meta

      - name: 下载 Windows 安装包
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-windows-*
          merge-multiple: true
          path: artifacts

      - name: 创建并推送当日 nightly tag
        # 轻量 tag 指向本次构建的 SHA；同名 tag 已存在（当天重复构建）则强制移到最新提交，
        # 保证「每天最多一个 nightly」。更早的 nightly 由末尾的步骤滚动清理，只留最新三个。
        env:
          NIGHTLY_TAG: ${{ needs.prepare.outputs.nightly_tag }}
        run: |
          set -euo pipefail
          git tag -f "$NIGHTLY_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$NIGHTLY_TAG" --force

      - name: 清理当天同名 release（重复构建时覆盖）
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.prepare.outputs.nightly_tag }}
        run: |
          gh release delete "$NIGHTLY_TAG" -y || echo "当天尚无同名 release，无需清理"

      - name: 创建 Nightly 预发布
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.prepare.outputs.nightly_tag }}
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.nightly_version }}
        run: |
          set -euo pipefail
          ls -la artifacts
          # 只发布 NSIS 安装包（便携版 zip 自 2026-09-14 起停止发布）：
          gh release create "$NIGHTLY_TAG" \
            --title "HyperPlayer Nightly (${NIGHTLY_VERSION})" \
            --notes-file changelog.md \
            --prerelease \
            --verify-tag \
            artifacts/*
          echo "已发布 Nightly 预发布：${NIGHTLY_TAG}（预发布，不覆盖正式 latest）"

      # ---------- 生成 nightly 渠道清单并提交 ----------
      # update-nightly.json 是「每日构建」渠道的更新清单（version 无关的固定地址）。
      # 客户端在渠道 = nightly 时拉取它；它指向当天的 pre-release 产物，
      # 与正式版清单 update.json 完全隔离，互不影响。
      - name: 生成 update-nightly.json
        env:
          NIGHTLY_TAG: ${{ needs.prepare.outputs.nightly_tag }}
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.nightly_version }}
        run: |
          set -euo pipefail
          cat > gen-nightly-manifest.cjs <<'JS'
          const fs = require('fs')
          const crypto = require('crypto')
          const path = require('path')

          const repo = process.env.GITHUB_REPOSITORY
          const tag = process.env.NIGHTLY_TAG
          const version = process.env.NIGHTLY_VERSION
          const dir = 'artifacts'
          const base = `https://github.com/${repo}/releases/download/${tag}`

          const files = fs.readdirSync(dir)
          const installer = files.find(f => /-Setup\.exe$/i.test(f))
          if (!installer) throw new Error('未找到 NSIS 安装包（*-Setup.exe）')

          const sha256 = (f) => crypto.createHash('sha256')
            .update(fs.readFileSync(path.join(dir, f)))
            .digest('hex')

          const manifest = {
            channel: 'nightly',
            version,
            notes: fs.readFileSync('changelog.md', 'utf8').trim(),
            artifacts: {
              'win-x64': { urls: [`${base}/${installer}`], sha256: sha256(installer) },
            },
          }

          fs.writeFileSync('update-nightly.json', JSON.stringify(manifest, null, 2) + '\n')
          console.log('已生成 update-nightly.json：')
          console.log(JSON.stringify(manifest, null, 2))
          JS
          node gen-nightly-manifest.cjs
          rm -f gen-nightly-manifest.cjs

      - name: 提交 update-nightly.json 到默认分支
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.nightly_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update-nightly.json
          if git diff --cached --quiet; then
            echo "update-nightly.json 无变化，跳过提交"
          else
            git commit -m "chore(nightly): 更新 update-nightly.json 至 ${NIGHTLY_VERSION}"
            git push origin HEAD:main
            echo "已推送 update-nightly.json（nightly 渠道用户「检查更新」可收到 ${NIGHTLY_VERSION}）"
          fi
      # ---------- 滚动保留最近 3 个 nightly ----------
      # 每次发布成功后清掉更早的 nightly：删除 GitHub release 及其 tag，
      # 只留最新的三个（按 tag 名里的日期倒序）。正式版 tag（v*）与 release 一律不碰。
      - name: 保留最近 3 个 nightly（删除更早的）
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: '3'
        run: |
          set -euo pipefail
          # nightly-YYYYMMDD 按名字排序即时间序，最新在前；当天 tag 刚推送，必然在其中。
          mapfile -t ALL < <(git tag -l 'nightly-*' --sort=-refname)
          echo "现有 nightly tag：${#ALL[@]} 个"
          printf '%s\n' "${ALL[@]:-}"
          if [ "${#ALL[@]}" -le "$KEEP" ]; then
            echo "未超过 ${KEEP} 个，无需清理。"
            exit 0
          fi
          for TAG in "${ALL[@]:$KEEP}"; do
            [ -z "$TAG" ] && continue
            echo "--- 清理 ${TAG} ---"
            # --cleanup-tag 会一并删掉对应 tag；release 不存在时忽略
            gh release delete "$TAG" -y --cleanup-tag \
              || echo "release ${TAG} 不存在，继续"
            # 兜底：release 已不在但 tag 残留时单独删远端 tag
            git push origin ":refs/tags/${TAG}" 2>/dev/null \
              || echo "远端 tag ${TAG} 已不存在，跳过"
          done
          echo "清理完成，保留最新 ${KEEP} 个："
          git tag -l 'nightly-*' --sort=-refname | head -n "$KEEP"
