name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 按提交涉及的路径决定跑哪些门禁（宁多跑不漏跑）；workflow 自身改动全量触发。
  # push 事件与上一个 commit 比较，PR 事件与目标基线比较，无法判定时全量运行。
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crates: ${{ steps.filter.outputs.crates }}
      netease: ${{ steps.filter.outputs.netease }}
      tauri: ${{ steps.filter.outputs.tauri }}
      frontend: ${{ steps.filter.outputs.frontend }}
      oracle: ${{ steps.filter.outputs.oracle }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            crates:
              - 'crates/**'
              - 'tests/fixtures/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/quality.yml'
            netease:
              - 'crates/hyperplayer-source-netease/**'
              - '.github/workflows/quality.yml'
            tauri:
              - 'src-tauri/**'
              - 'crates/**'
              - 'tests/fixtures/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/quality.yml'
            frontend:
              - 'app/**'
              - 'shared/**'
              - 'crates/hyperplayer-hse-core/**'
              - 'crates/hyperplayer-hrtf-core/**'
              - 'provenance/**'
              - 'tests/fixtures/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'rust-toolchain.toml'
              - '.github/workflows/quality.yml'
            oracle:
              - 'src/audio-source/**'
              - 'tests/oracle-tsconfig.json'
              - 'shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/quality.yml'

  frontend:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify HSE vendored destination
        run: pnpm check:hse-destination
      - name: Run frontend unit tests
        run: pnpm test
      - name: Build frontend assets for Tauri
        run: pnpm frontend:build

  oracle:
    name: Oracle TypeScript strict check
    needs: changes
    if: needs.changes.outputs.oracle == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Cleanroom oracle independently
        run: pnpm exec tsc -p tests/oracle-tsconfig.json --pretty false

  rust-crates:
    name: Rust crates fmt, clippy and test
    needs: changes
    if: needs.changes.outputs.crates == 'true' || needs.changes.outputs.netease == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            crates/hyperplayer-source-netease -> target
      - name: Check crates workspace formatting
        if: needs.changes.outputs.crates == 'true'
        working-directory: crates
        run: cargo fmt --all -- --check
      - name: Run crates workspace clippy
        if: needs.changes.outputs.crates == 'true'
        working-directory: crates
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run crates workspace tests
        if: needs.changes.outputs.crates == 'true'
        working-directory: crates
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Check Netease source formatting
        if: needs.changes.outputs.netease == 'true'
        working-directory: crates/hyperplayer-source-netease
        run: cargo fmt --all -- --check
      - name: Run Netease source clippy
        if: needs.changes.outputs.netease == 'true'
        working-directory: crates/hyperplayer-source-netease
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run Netease source tests
        if: needs.changes.outputs.netease == 'true'
        working-directory: crates/hyperplayer-source-netease
        run: cargo test --workspace --all-targets --all-features --locked

  rust-tauri:
    name: Tauri Rust fmt, clippy and test
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Run clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        working-directory: src-tauri
        run: cargo test --workspace --all-targets --all-features --locked
