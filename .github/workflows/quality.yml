name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify HSE vendored destination
        run: pnpm check:hse-destination
      - name: Run frontend unit tests
        run: pnpm test
      - name: Build frontend assets for Tauri
        run: pnpm frontend:build

  oracle:
    name: Oracle TypeScript strict check
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Cleanroom oracle independently
        run: pnpm exec tsc -p tests/oracle-tsconfig.json --pretty false

  rust-crates:
    name: Rust crates fmt, clippy and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            crates/hyperplayer-source-netease -> target
      - name: Check crates workspace formatting
        working-directory: crates
        run: cargo fmt --all -- --check
      - name: Run crates workspace clippy
        working-directory: crates
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run crates workspace tests
        working-directory: crates
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Check Netease source formatting
        working-directory: crates/hyperplayer-source-netease
        run: cargo fmt --all -- --check
      - name: Run Netease source clippy
        working-directory: crates/hyperplayer-source-netease
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run Netease source tests
        working-directory: crates/hyperplayer-source-netease
        run: cargo test --workspace --all-targets --all-features --locked

  rust-tauri:
    name: Tauri Rust fmt, clippy and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Run clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        working-directory: src-tauri
        run: cargo test --workspace --all-targets --all-features --locked
