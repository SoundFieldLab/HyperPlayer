name: Licenses

on:
  push:
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "deny.toml"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/check-js-licenses.mjs"
      - ".github/workflows/licenses.yml"
  pull_request:
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "deny.toml"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/check-js-licenses.mjs"
      - ".github/workflows/licenses.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --target x86_64-pc-windows-msvc
          manifest-path: crates/Cargo.toml
      - name: Check Netease source dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --target x86_64-pc-windows-msvc
          manifest-path: crates/hyperplayer-source-netease/Cargo.toml
      - name: Check Tauri dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --target x86_64-pc-windows-msvc
          manifest-path: src-tauri/Cargo.toml

  javascript:
    name: JavaScript dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production licenses and notices
        run: node tests/check-js-licenses.mjs
