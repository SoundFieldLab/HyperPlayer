# CI 检查：每次 push 代码，GitHub 自动帮你跑「类型检查 + 单测 + 构建」。
# 任何一步红了，提交旁边就会出现红叉；全绿说明 master 在（至少）Web 端和类型层面是能跑的。
#
# 触发时机：
#   push（任何分支）       -> 快速检查（几秒钟 ~ 1 分钟，便宜）
#   打 tag（v*）           -> 额外构建 Windows 安装包（出包自动化，release.yml 负责发布）
#   手动触发（Actions 页面点 "Run workflow"）-> 随时可以强制跑所有构建
#
# 各平台构建命令都在 package.json 里（npm run build:electron），
# CI 只是把这些命令挂到 GitHub 上自动执行，机器装好对应工具链即可。

name: CI 检查

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- 快速检查：类型 + 单测 + 前端构建 ----------
  checks:
    name: 快速检查（类型/单测/构建）
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 v3 worklet（prebuild 钩子）
        run: npm run prebuild

      - name: 类型检查（tsc --noEmit）
        run: npm run lint

      - name: 运行单测（vitest）
        run: npm run test

      - name: 运行 RGB 与桌面安全测试
        run: npm run test:chroma && npm run test:signalrgb && npm run test:desktop

      - name: 前端构建（vite build）
        run: npm run build

  # ---------- Windows 安装包构建（打 tag / 手动触发） ----------
  windows-build:
    name: Windows 安装包构建
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 下载 Electron 运行时（npm ci 的 allow-scripts 会跳过其安装脚本）
        run: node node_modules/electron/install.js

      - name: 安装 castLabs EVS（Apple Music 生产 VMP）
        run: py -3 -m pip install castlabs-evs==1.3.2

      - name: 构建 Windows 安装包（生产 VMP 必需）
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: "1"
        run: npm run build:electron

      - name: 上传安装包（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: hyperplayer-windows-installer
          path: release/*.exe
