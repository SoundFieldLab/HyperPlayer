# CI 检查 —— 每次 push / PR 自动跑「类型检查 + 单测 + 前端构建 + 打包验证」。
#
# 定位：**只做校验，不产出可分发产物**。真正的安装包由 nightly.yml（每日）与
# pre-release.yml（打版本 tag）负责构建与发布。
#
# 触发：
#   push（任何分支）/ PR  -> 快速检查（ubuntu，便宜）
#   打 v* tag / 手动触发   -> 额外在 Windows 上验证打包链路（不签名、不需要任何 secret）
#
# 为什么打包验证用 build:electron:dir:unsigned：
#   正式构建（build:electron）需要 castLabs EVS 凭据做 Widevine VMP 签名，那属于发布环节；
#   CI 只关心「代码能否被 electron-builder 打好目录、资源是否齐全」，用 unsigned 变体即可。

name: CI 检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 快速检查：类型 / 单测 / 构建 ----------
  checks:
    name: 快速检查（类型 / 单测 / 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 本作业只做类型检查 / 单测 / 前端构建，均不依赖 Electron 运行时，跳过其二进制下载以省时。
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（tsc --noEmit）
        run: npm run lint

      - name: 单元测试（vitest）
        run: npm run test

      - name: 桌面集成与安全测试（node:test）
        run: npm run test:desktop

      - name: 安装器资产与文案测试
        run: npm run test:installer

      - name: 灯效插件测试（Chroma / SignalRGB）
        run: npm run test:chroma && npm run test:signalrgb

      - name: 前端构建（vite build）
        run: npm run build

  # ---------- 打包验证（Windows；仅 tag / 手动触发） ----------
  package-verify:
    name: 打包验证（Windows，未签名）
    runs-on: windows-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 下载 Electron 运行时（npm ci 跳过其安装脚本）
        run: node node_modules/electron/install.js

      - name: 构建未签名目录（验证 electron-builder 配置与资源）
        run: npm run build:electron:dir:unsigned

      - name: 校验打包产物关键文件齐全
        shell: pwsh
        run: |
          $must = @(
            'release/win-unpacked/HyperPlayer.exe',
            'release/win-unpacked/resources/app.asar',
            'release/win-unpacked/resources/logo.png',
            'release/win-unpacked/resources/build/icon.ico'
          )
          $missing = @($must | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error ("打包产物缺少必需文件：`n" + ($missing -join "`n"))
            exit 1
          }
          Write-Host '✓ 打包产物关键文件齐全'
