name: Manual - Netease login and VIP matrix

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type LOGIN-VIP-MATRIX to use protected test accounts
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-netease-login-vip
  cancel-in-progress: false

jobs:
  matrix:
    name: Login and D23 entitlement matrix
    runs-on: windows-latest
    environment: netease-login-vip-acceptance
    timeout-minutes: 15
    env:
      HYPERPLAYER_ACCEPTANCE_DRIVER: ${{ vars.HYPERPLAYER_ACCEPTANCE_DRIVER }}
      HYPERPLAYER_NETEASE_TEST_ACCOUNTS_JSON: ${{ secrets.HYPERPLAYER_NETEASE_TEST_ACCOUNTS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: Mask protected account bundle
        shell: pwsh
        run: Write-Output "::add-mask::$env:HYPERPLAYER_NETEASE_TEST_ACCOUNTS_JSON"
      - name: Run login and VIP matrix
        shell: pwsh
        run: ./scripts/acceptance/Invoke-NeteaseLoginVipMatrix.ps1 -Confirmation '${{ inputs.confirmation }}'
